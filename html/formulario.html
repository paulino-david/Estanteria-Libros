<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />

    <!-- Font letter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Animaciones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <title>Document</title>
  </head>
  <body>
    <div class="upDesign">
      <h1>eBooker</h1>
    </div>

    <main class="divFormula">
      <div class="menuMovil" id="menuMovil">
        <div class="inmenu animate__animated animate__slideInLeft">
          <div class="upDesign">
            <h2>eBooker</h2>
          </div>

          <ol>
            <a href="../index.html">
              <li>
                Libros registrados <i class="fa-solid fa-layer-group"></i>
              </li>
            </a>
            <a href="">
              <li class="here">Nuevo libro <i class="fa-solid fa-plus"></i></li>
            </a>
            <a href="">
              <li>
                Ver libros leidos <i class="fa-solid fa-book-open-reader"></i>
              </li>
            </a>
          </ol>
        </div>
        <div class="cancelar" id="cancelarMenu">
          <!-- <i class="fa-solid fa-xmark"></i> -->
        </div>
      </div>
      <div class="buscar">
        <div class="menu filtrar" style="display: none" id="verMenu">
          <i class="fa-solid fa-bars"></i>
        </div>

        <div class="filtrar verLeidos">
          <i class="fa-solid fa-book-open-reader"></i>
          <span>Ver libros leidos</span>
        </div>

        <input
          id="buscar"
          type="search"
          class="buscar"
          placeholder="Buscar por titulo"
        />

        <div class="filtrar" id="filtrar">
          <i class="fa-solid fa-filter"></i>
          <select name="" id="filtro">
            <!-- <option value="" selected disabled>Filtrar</option> -->
            <option value="titulo">Titulo</option>
            <option value="autor">Autor</option>
          </select>
          <!-- Filtrar  -->
        </div>
      </div>

      <form action="" class="divFormulario formularioMovil" id="form-libro">
        <div class="msg" id="msg"></div>

        <div class="top">
          <h2>Registre su libro</h2>
          <p>
            En esta seccion se registran los libros con sus titulos y sus
            autores
          </p>
        </div>

        <div class="inputs">
          <input type="text" id="titulo" placeholder="Titulo" />
          <input type="text" id="autor" placeholder="Autor" />
        </div>

        <button type="submit">Añadir libro</button>
      </form>
    </main>

    <script type="module" src="../js/formulario.js"></script>
  </body>
</html>
