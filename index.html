<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Font letter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Icon -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <title>Document</title>
  </head>
  <body>
    <div class="upDesign">
      <h1>eBooker</h1>
    </div>
    <main>
      <div class="divEstanteria">

        <div class="buscar">
          <input type="search" class="buscar" placeholder="Buscar por nombre">
          <div class="filtrar" id="filtrar">
            Filtrar <i class="fa-solid fa-filter"></i>
          </div>
        </div>

        <div class="estanteria" id="estanteria">
          <ul id="lista">

          </ul>

        </div>

          <div id="contador">

          </div>

      </div>
      <hr />
      <form action="" class="divFormulario" id="form-libro">

        <div class="msg" id="msg">
        </div>

        <div class="top">
          <h2>
            Registre su libro
          </h2>
          <p>
            En esta seccion se registran los libros con sus titulos y sus autores
          </p>
        </div>

        <div class="inputs">
          <input type="text" id="titulo" placeholder="Titulo"/>
          <input type="text" id="autor" placeholder="Autor"/>
        </div>

        <button type="submit">
          Añadir libro
        </button>
      </form>

    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
