<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Font letter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="formulario">
        <div class="comunicado">
          <h1>Hola, soy 4tuLibros</h1>
          <p>Aqui te comento el estado de las operaciones que hagas</p>
        </div>

        <form action="">
          <h1>Mi estanteria</h1>
          <div class="inputs">
            <input
              type="text"
              name=""
              placeholder="Titulo"
              id="titulo"
              required
            />
            <input
              type="text"
              name=""
              placeholder="Autor del libro"
              required
              id="autor"
            />
          </div>
          <div class="div-btn-form">
            <button type="button" id="btn-btn-add">Añadir libro</button>
          </div>
        </form>
      </div>

      <p id="contador"></p>
      <ul id="lista"></ul>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
